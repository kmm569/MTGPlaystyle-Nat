<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Magic Playstyle Test</title>
	
<script>
	(function () {
		// Pink is the default. A theme someone already saved in their browser is still respected, but nothing is written or overwritten.
		const validThemes = ["office", "dark", "pink"];
		let theme = "pink";

		try {
			const saved = localStorage.getItem("magic-site-theme");
			if (validThemes.includes(saved)) theme = saved;
		} catch {
			// Fall back to pink if storage is unavailable.
		}

		document.documentElement.dataset.theme = theme;
	})();
</script>

	<link rel="stylesheet" href="main.css">
</head>
<body>
	<main>
		<header class="page-header">
			<h1>MAGIC PLAYSTYLE TEST</h1>
			<p>for my amazing awesome gf so i can buy her a deck</p>
		</header>

		<section id="quiz" class="form-box">
			<div class="quiz-info">
				<span id="phaseLabel"></span>
				<span id="questionNumber"></span>
			</div>

			<div class="progress">
				<div id="progressBar"></div>
			</div>

			<div id="jumpNav" class="jump-nav hidden"></div>

			<h2 id="questionText"></h2>

			<div id="answers" class="answers"></div>

			<div class="actions">
				<button id="backBtn" class="secondary" type="button">Back</button>
				<button id="nextBtn" class="primary" type="button">Continue</button>
				<button id="resultsBtn" class="secondary hidden" type="button">View Results</button>
			</div>

			<div id="reviewTools" class="review-tools hidden">
				<button id="removeBtn" class="secondary" type="button">Remove Answer</button>
			</div>
		</section>

		<div id="newQuestionBar" class="new-question-bar hidden">
			<button id="newQuestionBtn" class="secondary" type="button">New Question</button>
		</div>

		<section id="results" class="form-box hidden">
			<h2>Your Results</h2>
			<p id="resultsDescription"></p>

			<div id="scoreGroups"></div>

			<div class="actions result-actions">
				<button id="continueBtn" class="primary" type="button">Answer More Questions</button>
				<button id="reviewBtn" class="secondary" type="button">Review Answers</button>
				<button id="reviewCoreBtn" class="secondary hidden" type="button">Review Core Questions</button>
				<button id="reviewOptionalBtn" class="secondary hidden" type="button">Review Optional Questions</button>
				<button id="copyBtn" class="secondary" type="button">Copy Results</button>
				<button id="resetBtn" class="secondary" type="button">Start Over</button>
			</div>

			<details class="debug">
				<summary>Scoring Details</summary>
				<pre id="debugOutput"></pre>
			</details>
		</section>

		<section id="errorPanel" class="form-box hidden">
			<h2>Something went wrong</h2>
			<p id="errorText"></p>
		</section>
	</main>

	<script type="module" src="app.js"></script>
</body>
</html>
